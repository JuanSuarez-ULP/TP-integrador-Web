<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timo Sport</title>
</head>
<body>
    <header>
      <div class="contenedor-nav">
        <div class="contenedor-logo">
          <a href="index.html">
            <img src="Imagenes/logo.png" alt="Logo Timo Sport" class="logo" />
          </a>
        </div>
        <nav>
          <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="servicios.html">Servicios</a></li>
            <li><a href="contacto.html">Formulario Alquiler y Ubicación</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="titulo">
        <h1>Reserva tu Cancha</h1>
        <p>
          Completa el formulario para consultar disponibilidad y realizar tu
          reserva
        </p>
      </section>

      <section class="form-section">
        <form id="alquiler-form" novalidate>
          <div class="form">
            <label for="nombre">Nombre Completo *</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Ej. Jose Fernandez"
            />
            <span class="error" id="error-nombre"></span>
          </div>

          <div class="form">
            <label for="email">Correo Electrónico *</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="ejemplo@correo.com"
            />
            <span class="error" id="error-email"></span>
          </div>

          <div class="form">
            <label for="telefono">Teléfono / WhatsApp *</label>
            <input
              type="tel"
              id="telefono"
              name="telefono"
              placeholder="Ej. 2664556677"
            />
            <span class="error" id="error-telefono"></span>
          </div>

          <div class="form">
            <label for="fecha">Fecha de Reserva *</label>
            <input type="date" id="fecha" name="fecha" />
            <span class="error" id="error-fecha"></span>
          </div>

          <div class="form">
            <label for="hora">Horario Preferido *</label>
            <select id="hora" name="hora">
              <option value="17:00 hs">17:00 hs</option>
              <option value="18:00 hs">18:00 hs</option>
              <option value="19:00 hs">19:00 hs</option>
              <option value="20:00 hs">20:00 hs</option>
              <option value="21:00 hs">21:00 hs</option>
              <option value="22:00 hs">22:00 hs</option>
              <option value="23:00 hs">23:00 hs</option>
              <option value="00:00 hs">00:00 hs</option>
            </select>
          </div>

          <button type="submit" class="btn-submit">
            Enviar Solicitud de Reserva
          </button>
        </form>

      </section>
    </main>
</body>
</html>
